name: Validering

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'custom_components/hyggespil/www/hs-cfg.js'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  spil:
    name: Spillets filer og integrationens logik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tjek manifest som Home Assistant
        run: python tools/tjek_manifest.py
      - name: Syntaks og privatlivskontrol
        run: node tools/build.js check
      - name: Integrationens logik (uden Home Assistant)
        run: python tools/verify_integration.py
      - name: Kan zippet installeres? (samme udpakning som Marketplace/HACS)
        run: python tools/tjek_installation.py
      - name: Blueprint til spændingslyset
        run: |
          python -m pip install --quiet pyyaml
          python tools/tjek_blueprint.py
      - name: README er i sync med version og ændringslog
        run: python tools/opdater_readme.py --tjek
      - name: Spørgsmålspuljerne kan dekrypteres
        run: node tools/krypt.js --tjek
      - name: Kvalitetsrapport for spørgsmål og svar
        run: node tools/kvalitet.js
