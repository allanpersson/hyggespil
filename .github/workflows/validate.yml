name: Validering

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'custom_components/hyggespil/www/hs-cfg.js'
      - 'tools/prov_ci.md'   # midlertidig: udløser ét løb for at prøve daglig-udgivelse
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  spil:
    name: Spillets filer og integrationens logik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntaks og privatlivskontrol
        run: node tools/build.js check
      - name: Integrationens logik (uden Home Assistant)
        run: python tools/verify_integration.py
