name: Overvågning

# Kontrollerer at alt hænger sammen – men kun på et fast tidspunkt og manuelt.
# Den kører IKKE ved hvert push: en kontrol, der dømmer en commit midt i en udgivelse,
# giver røde krydser på GitHub, som ikke betyder, at noget er i stykker.
#
# Tjekker: alle filer på GitHub = den lokale HEAD, nyeste udgivelse er en almindelig
# x.x.x med et zip Marketplace kan installere, og ingen workflow på samme commit fejler.

on:
  schedule:
    - cron: "40 7 * * *"        # lige efter den daglige udgivelse
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  overvaag:
    name: Filer, udgivelse og CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Overvåg GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/overvaag.js
