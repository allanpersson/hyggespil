name: Daglig udgivelse

# Bygger og udgiver en ny almindelig version (x.x.x), når spillets indhold er ændret.
# Kører hver morgen efter natjobberne og kan skydes manuelt.
#
# Vigtigt: versionen er ALTID x.x.x uden -beta. GitHub Marketplace/HACS læser
# /releases/latest, som springer prereleases over – en prerelease får derfor
# Marketplace til at vise en commit-SHA i stedet for en version.
#
# Zippet bygges med integrationens filer i roden (se tools/make_zip.py), fordi både
# Marketplace og HACS pakker zippet ud direkte i custom_components/<domæne>.

on:
  schedule:
    - cron: "20 7 * * *"        # kl. 07:20 UTC = 08:20 dansk vintertid
  push:
    branches: [main]
    paths:
      - 'custom_components/hyggespil/www/**'
      - '!custom_components/hyggespil/www/hs-cfg.js'
      - 'custom_components/hyggespil/*.py'
      - 'custom_components/hyggespil/translations/**'
  workflow_dispatch:
    inputs:
      tving:
        description: Udgiv også selv om indholdet ser uændret ud
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: udgivelse
  cancel-in-progress: false

jobs:
  udgiv:
    name: Byg og udgiv ny version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Er dette CI's eget loop?
        id: loop
        run: |
          if git log -1 --pretty=%an | grep -q "github-actions"; then
            echo "loop=ja" >> "$GITHUB_OUTPUT"
            echo "Springer over: sidste commit er CI's egen versions-commit"
          else
            echo "loop=nej" >> "$GITHUB_OUTPUT"
          fi

      - name: Næste version
        if: steps.loop.outputs.loop == 'nej'
        id: version
        run: |
          tags=$(git tag -l | tr '\n' ' ')
          naeste=$(python tools/naeste_version.py "$tags" --stabil)
          echo "version=$naeste" >> "$GITHUB_OUTPUT"
          echo "eksisterende tags: ${tags:-ingen}"
          echo "næste version: $naeste"

      - name: Er der nyt indhold?
        if: steps.loop.outputs.loop == 'nej'
        id: indhold
        run: |
          # Kadence: under 200 i mindste pulje = dagligt, 200+ = hver 3. dag, 300+ = ugentligt
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f docs/puljestatus.json ]; then
            python - <<'PY'
          import json, subprocess, datetime, sys
          s = json.load(open("docs/puljestatus.json", encoding="utf-8"))
          min = s.get("min", 0)
          dage = 7 if min >= 300 else (3 if min >= 200 else 0)
          if dage:
              ud = subprocess.run(["gh", "release", "list", "--limit", "1", "--json", "publishedAt"],
                                  capture_output=True, text=True).stdout
              try:
                  sidst = datetime.datetime.fromisoformat(json.loads(ud)[0]["publishedAt"].replace("Z", "+00:00"))
                  alder = (datetime.datetime.now(datetime.timezone.utc) - sidst).days
              except Exception:
                  alder = 999
              print(f"mindste pulje: {min} → udgivelse hver {dage}. dag (sidste for {alder} dage siden)")
              if alder < dage:
                  open("/tmp/spring", "w").write("ja")
          PY
            if [ -f /tmp/spring ]; then echo "Springer over: kadence ikke nået"; echo "ja=nej" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          seneste=$(git tag --sort=-creatordate | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$seneste" ]; then
            echo "Ingen tidligere udgivelse - udgiver."
            echo "ja=ja" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ inputs.tving }}" = "true" ]; then
            echo "Tvinget udgivelse."
            echo "ja=ja" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$seneste" HEAD -- custom_components/hyggespil ':(exclude)custom_components/hyggespil/manifest.json' ':(exclude)custom_components/hyggespil/www/hs-cfg.js'; then
            echo "Ingen ændring i spilfilerne siden $seneste - ingen udgivelse."
            echo "ja=nej" >> "$GITHUB_OUTPUT"
          else
            echo "Ændret siden $seneste:"
            git diff --stat "$seneste" HEAD -- custom_components/hyggespil | tail -n 8
            echo "ja=ja" >> "$GITHUB_OUTPUT"
          fi

      - name: Sæt version i manifest, spillet og CHANGELOG
        if: steps.loop.outputs.loop == 'nej' && steps.indhold.outputs.ja == 'ja'
        run: |
          v="${{ steps.version.outputs.version }}"
          seneste=$(git tag --sort=-creatordate | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || echo "")
          python - "$v" <<'PY'
          import json, re, sys
          v = sys.argv[1]
          m = "custom_components/hyggespil/manifest.json"
          data = json.load(open(m, encoding="utf-8"))
          data["version"] = v
          open(m, "w", encoding="utf-8").write(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          p = "custom_components/hyggespil/www/hs-cfg.js"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r"version:'[\w.\-]+'", "version:'" + v + "'", s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print("manifest og spillet melder version", v)
          PY
          # Kuraterede noter til denne udgivelse? Så bruges de med det samme.
          NOTES="docs/udgivelsesnoter.md"
          if [ -f "$NOTES" ] && [ -n "$(sed -E 's/<!--.*-->//g' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "bruger kuraterede noter fra $NOTES"
            sed -E 's/<!--.*-->//g' "$NOTES" | sed '/^[[:space:]]*$/d' | sed 's/[[:space:]]*$//' > /tmp/nyheder.txt
            : > "$NOTES"
          else
            if [ -z "$seneste" ]; then range="HEAD"; else range="$seneste..HEAD"; fi
            git log "$range" --no-merges --pretty=format:'- %s' | grep -vE '^- (Overvaagning|Opdater overvaag|Dokumentation|README|Foelger CI|Fjerner |Rettet installationsfejlen|Rettet traeopslag|Logger version|Beskriver)' > /tmp/nyheder.txt || true
            test -s /tmp/nyheder.txt || echo '- Vedligeholdelse og fejlretning.' > /tmp/nyheder.txt
          fi
          python tools/indsæt_afsnit.py "$v" /tmp/nyheder.txt
          # README opdateres EFTER changelog-afsnittet, så "Nyheder" får den nye version med.
          python tools/opdater_readme.py
          grep -q "^## $v" CHANGELOG.md || { echo "FEJL: CHANGELOG mangler afsnittet for $v"; exit 1; }
          grep -q "Version:.*$v" README.md || { echo "FEJL: README melder ikke version $v"; exit 1; }

      - name: Tjek inden udgivelse
        if: steps.loop.outputs.loop == 'nej' && steps.indhold.outputs.ja == 'ja'
        run: |
          python tools/tjek_manifest.py
          node tools/krypt.js --tjek
          node tools/build.js check
          python tools/verify_integration.py
          python tools/tjek_installation.py

      - name: Commit og sæt tag
        if: steps.loop.outputs.loop == 'nej' && steps.indhold.outputs.ja == 'ja'
        run: |
          v="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/hyggespil/manifest.json custom_components/hyggespil/www/hs-cfg.js CHANGELOG.md README.md docs/udgivelsesnoter.md docs/antal.json
          git commit -m "Udgivelse $v (automatisk)"
          # main kan være flyttet, mens jobbet kørte (fx en synkronisering): rebase og prøv igen
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { echo "rebase fejlede"; exit 1; }
            if git push origin HEAD:main; then break; fi
            echo "push afvist, prøver igen ($i/3)"
            sleep 5
          done
          git tag -f "$v"
          git push -f origin "refs/tags/$v"

      - name: Byg zippet FRA tagget
        if: steps.loop.outputs.loop == 'nej' && steps.indhold.outputs.ja == 'ja'
        run: |
          git checkout --detach "${{ steps.version.outputs.version }}"
          python tools/make_zip.py .
          test -f hyggespil.zip || { echo "Zippet blev ikke lavet"; exit 1; }
          # Zippet udpakkes direkte i custom_components/<domæne>: manifest.json SKAL ligge i roden.
          if ! unzip -Z1 hyggespil.zip | grep -qx "manifest.json"; then
            echo "FEJL: manifest.json ligger ikke i zippets rod - Marketplace/HACS kan ikke installere det"
            unzip -Z1 hyggespil.zip | head -n 20
            exit 1
          fi
          if unzip -Z1 hyggespil.zip | grep -qE "^(custom_components/|ledger\.json$|extra\.json$|.*secrets)"; then
            echo "FEJL: zippet har en indpakket rod eller indeholder filer, der ikke må udgives"
            unzip -Z1 hyggespil.zip | head -n 20
            exit 1
          fi
          echo "zippet indeholder $(unzip -Z1 hyggespil.zip | wc -l) filer"

      - name: Opret udgivelse med zip
        if: steps.loop.outputs.loop == 'nej' && steps.indhold.outputs.ja == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          python - "$v" <<'PY'
          import re, sys
          v = sys.argv[1]
          tekst = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(v) + r"\s+[–-]\s+.*?$(.*?)(?=^## |\Z)", tekst, flags=re.M | re.S)
          krop = (m.group(1).strip() if m else "Se CHANGELOG.md for hvad der er nyt.")
          open("/tmp/noter.md", "w", encoding="utf-8").write(
              "## Hyggespil " + v + "\n\n" + krop +
              "\n\n---\nHent: Indstillinger → Marketplace → Hyggespil → Opdater, og genstart Home Assistant.\n")
          print(krop[:200])
          PY
          ls -l hyggespil.zip || { echo "zippet mangler"; exit 1; }
          if gh release view "$v" --json tagName >/dev/null 2>&1; then
            gh release edit "$v" --notes-file /tmp/noter.md 2>&1 || true
            gh release upload "$v" hyggespil.zip --clobber 2>&1
          else
            gh release create "$v" --title "Hyggespil" --notes-file /tmp/noter.md 2>&1
            gh release upload "$v" hyggespil.zip 2>&1
          fi
          gh release view "$v" --json tagName,assets,isPrerelease 2>&1
          # Verificér det udgivne asset, som Marketplace ser det (udpakning i custom_components/<domæne>)
          mkdir -p /tmp/hentet
          gh release download "$v" --pattern hyggespil.zip --dir /tmp/hentet --clobber
          python tools/tjek_installation.py /tmp/hentet/hyggespil.zip

      - name: Status
        if: always()
        run: |
          echo "næste version: ${{ steps.version.outputs.version }}"
          echo "udgivet: ${{ steps.indhold.outputs.ja }}"
          if [ "${{ steps.indhold.outputs.ja }}" = "nej" ]; then
            echo "Ingen ny udgivelse denne gang - spilfilerne er uændrede."
          else
            echo "Ny udgivelse: ${{ steps.version.outputs.version }}"
          fi
