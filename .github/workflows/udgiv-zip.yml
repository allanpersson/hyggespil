name: Udgiv zippet

# Vedhæfter hyggespil.zip til den GitHub-release, der netop er publiceret.
# Zippet er den PAKKE, Marketplace/HACS henter – tilsammen med "zip_release" i hacs.json
# betyder det, at brugere ALDRIG kan få en version, der ikke er udgivet ordentligt (ingen commit-SHA'er).

on:
  release:
    types: [published]

jobs:
  zip:
    name: Byg hyggespil.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pak integrationen
        run: python tools/make_zip.py .
      - name: Vedhæft til release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" hyggespil.zip --clobber
