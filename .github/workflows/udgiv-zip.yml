name: Udgiv zippet

# Bygger hyggespil.zip og vedhæfter den release'en, hvis der ikke allerede er lagt en ved.
# tools/release.js laegger den selv ved automatiske udgivelser; dette dækker manuelle releases.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Hvilket tag zippet skal vedhæftes (fx 0.1.0-beta.1)
        required: true

permissions:
  contents: write

jobs:
  zip:
    name: Byg hyggespil.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Er zippet allerede vedhæftet?
        id: kontrol
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "hyggespil.zip"; then
            echo "allerede=ja" >> "$GITHUB_OUTPUT"; echo "hyggespil.zip findes allerede i $TAG"
          else
            echo "allerede=nej" >> "$GITHUB_OUTPUT"
          fi
      - name: Pak integrationen
        if: steps.kontrol.outputs.allerede == 'nej'
        run: python tools/make_zip.py .
      - name: Vedhaeft til release
        if: steps.kontrol.outputs.allerede == 'nej'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" hyggespil.zip
