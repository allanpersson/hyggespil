name: Udgiv zippet

# Hver gang der oprettes en release på GitHub (manuelt, via tools/publish.js, eller ved at pushe et tag),
# bygges hyggespil.zip og vedhæftet release'en. Det er den fil, Marketplace/HACS henter (se hacs.json).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Hvilket tag zippet skal vedhæftes (fx 0.1.0-beta.1)
        required: true

permissions:
  contents: write

jobs:
  zip:
    name: Byg hyggespil.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pak integrationen
        run: python tools/make_zip.py .
      - name: Vedhæft til release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" hyggespil.zip --clobber
