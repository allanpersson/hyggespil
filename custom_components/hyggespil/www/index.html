<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hygge Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><!-- ingen eksterne kald: spillet kører 100 % lokalt i Home Assistant -->
<style>
:root{--bg:#0f0a24;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--tx:#fff;--mut:#b9b4d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{padding-top:28px;padding-bottom:calc(64px + env(safe-area-inset-bottom));max-width:100%;overflow-x:hidden}html.hs-native body{padding-top:6px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#app,#main,.card,.mbox{max-width:100%}
svg,img{max-width:100%;height:auto}
.q,.ans,.opt,.tag,.hint,.rk,.c1ins,.wsol{overflow-wrap:anywhere;word-break:break-word}
body{margin:0;min-height:100vh;font-family:Poppins,system-ui,Segoe UI,Roboto,sans-serif;color:var(--tx);background:var(--bg);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;animation:drift 22s ease-in-out infinite alternate}
body:before{background:#ff3d81;top:-25vmax;left:-15vmax}
body:after{background:#3a86ff;bottom:-25vmax;right:-15vmax;animation-delay:-8s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:12px}header h1{flex:0 0 auto;white-space:nowrap;font-size:clamp(18px,4.6vw,28px);margin:0}header .sp{flex:1}header .btn{padding:8px 10px;white-space:nowrap}
h1{margin:0;font-size:26px;font-weight:800;background:linear-gradient(90deg,#ffb703,#ff5d8f,#8f6bff,#4cc9f0);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1;cursor:pointer}
button{font:inherit;cursor:pointer;border:0;color:#fff}
.btn{padding:10px 18px;border-radius:14px;font-weight:700;background:linear-gradient(135deg,#8f6bff,#ff5d8f);box-shadow:0 6px 20px rgba(143,107,255,.35);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ff3d6e,#c9184a)}
.btn.big{padding:15px 30px;font-size:18px;border-radius:18px}
.btn.green{background:linear-gradient(135deg,#2ec4b6,#80ed99);color:#06221f}
.btn[disabled]{opacity:.4;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#score{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
body.igang #score{display:none}
body.igang #app{padding-top:10px}
body.igang header{display:none}
.sc{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:50px;background:var(--glass);border:1px solid var(--line)}
.sc .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--c);color:#111}
.sc .pt{font-size:22px;font-weight:800;min-width:24px;text-align:center}
.sc.lead{box-shadow:0 0 0 2px #ffb703,0 0 24px rgba(255,183,3,.45)}
.grp{margin:22px 0 10px;font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.gc{padding:22px 22px 14px;border-radius:26px;text-align:left;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;gap:2px;background:var(--g);box-shadow:0 12px 30px rgba(0,0,0,.35);transition:transform .2s}
.gc:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.34) 100%)}
.gc>*{position:relative;z-index:1}
.gc:hover{transform:translateY(-5px) rotate(-.6deg)}
.gc .em{font-size:44px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.gc .t{font-size:20px;font-weight:800;margin-top:6px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.gc .d{font-size:13px;opacity:.95;margin:4px 0 8px;color:#fff;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.gc .mn{position:absolute;top:12px;right:14px;font-size:12px;background:rgba(10,6,25,.55);backdrop-filter:blur(4px);padding:3px 9px;border-radius:20px;z-index:2;font-weight:700}

.pswrap{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:100%}.pswrap .ps{position:static;font-size:11px;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.5);max-width:100%;overflow-wrap:anywhere;line-height:1.25}.pswrap .ps.snart{background:rgba(124,58,237,.6);border:1px solid #a78bfa;padding:2px 8px;border-radius:999px;font-weight:800;opacity:1;color:#fff}
.pswrap .ps.ny{background:rgba(20,12,40,.55);border:1px solid rgba(255,183,3,.75);padding:3px 9px;border-radius:999px;font-weight:800;opacity:1;font-size:10.5px;color:#ffe9b0}
.card{padding:26px;margin-bottom:16px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}
.q{font-size:clamp(22px,3.4vw,34px);font-weight:700;line-height:1.3;text-align:center;margin:10px 0 18px}
.tag{display:inline-block;padding:5px 14px;border-radius:30px;font-size:13px;font-weight:700;background:rgba(255,255,255,.12)}
.bar{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;align-items:center;margin-bottom:12px;position:relative;background:linear-gradient(180deg,#160e33f7,#160e33e6);padding:6px 0;border-radius:0 0 12px 12px}body.igang #main{padding-top:58px}body.igang #main .bar{position:fixed;top:env(safe-area-inset-top);left:0;right:0;z-index:9;border-radius:0;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));margin:0;background:#160e33f7}.bar .sp{flex:1}.bar .tag{min-width:0;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .btn{padding:8px 10px;flex:0 0 auto}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0}
.zone{border-radius:20px;border:2px dashed var(--line);padding:10px;min-height:96px;transition:.2s;background:rgba(255,255,255,.04)}
.zones .zone{border-color:var(--zc);background:linear-gradient(180deg,color-mix(in srgb,var(--zc) 22%,transparent),transparent)}
.zone.right{box-shadow:0 0 0 3px var(--zc),0 0 34px var(--zc);transform:scale(1.03)}
.zone.dim{opacity:.4}
.zl{font-weight:800;font-size:17px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.zl span{font-size:24px}
.zc{display:flex;gap:8px;flex-wrap:wrap;min-height:40px}
.pool{min-height:64px;margin-top:6px}
.chip{padding:9px 16px;border-radius:30px;font-weight:700;background:var(--c);color:#111;cursor:grab;touch-action:none;user-select:none;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .15s}
.chip.sel{outline:3px solid #fff;transform:scale(1.1)}.chip.lift{opacity:.3}
.chip.ghost{position:fixed;transform:translate(-50%,-50%) scale(1.15) rotate(-4deg);pointer-events:none;z-index:99;cursor:grabbing}
.chip.aw{cursor:pointer}.chip.aw:hover{transform:scale(1.08)}
.hint{color:var(--mut);font-size:13px;text-align:center}
input.in{width:100%;font:inherit;font-size:22px;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;text-align:center;outline:0}
input.in:focus{border-color:#ffb703}
.bids{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.bid{padding:14px 28px;border-radius:20px;text-align:center;background:var(--c);color:#111;min-width:140px}
.bid b{display:block;font-size:34px;line-height:1.1}.bid small{font-weight:700}
.ans{font-size:clamp(30px,6vw,56px);font-weight:800;text-align:center;background:linear-gradient(90deg,#ffb703,#ff5d8f,#4cc9f0);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .5s;margin:8px 0}
.res{display:flex;flex-direction:column;gap:6px;align-items:center;margin:10px 0;font-weight:600}
.res span{background:rgba(255,255,255,.1);padding:6px 14px;border-radius:20px}
.mid{display:grid;gap:10px;margin:10px 0}
.opt{padding:12px 16px;border-radius:16px;font-weight:600;animation:pop .4s}
.est{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.est .p{padding:12px;border-radius:18px;background:rgba(255,255,255,.06);border:2px solid var(--c)}
.est .p b{display:block;margin-bottom:8px;color:var(--c)}
.big-card{min-height:220px;display:grid;place-items:center}
.forb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.forb span{background:#c9184a;padding:6px 14px;border-radius:20px;font-weight:700;text-decoration:line-through}
.tm{font-size:34px;font-weight:800;text-align:center;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(5,2,20,.7);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(6px)}
.mbox{width:min(520px,100%);padding:24px;background:#1c1442;border:1px solid var(--line);border-radius:24px;max-height:90vh;overflow:auto}
.pl{display:flex;gap:8px;align-items:center;margin:6px 0}
.pl .chip{flex:1;cursor:default}.pl button{background:rgba(255,255,255,.12);border-radius:50%;width:34px;height:34px}
.pl input[type=color]{width:38px;height:34px;border:0;background:none;padding:0}
.conf{position:fixed;top:-30px;font-size:26px;z-index:90;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.rk{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.08);margin:8px 0;font-size:20px;font-weight:800}
.rk .n{flex:1}.rk.w{box-shadow:0 0 0 2px #ffb703,0 0 26px rgba(255,183,3,.45)}
@media(max-width:520px){.bar .tag{display:none}}</style></head><body><div id="app"></div>
<script src="hs-krypto.js?v=5"></script>
<script src="data.js?v=5"></script><script src="data2.js?v=5"></script><script src="data3.js?v=5"></script>
<script>
const LS={get(k,d){try{const v=localStorage.getItem('hs_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('hs_'+k,JSON.stringify(v))}catch(e){}}};
const COLORS=['#ff5d8f','#ffb703','#2ec4b6','#8f6bff','#4cc9f0','#80ed99','#ff7b00','#f15bb5'];
let players=LS.get('players',[]),own=LS.get('own',[]),view='home',g={},modal=null,tid=null;
const alderOK=x=>!x.alder||players.every(p=>!p||!p.age||p.age>=x.alder);   // vises kun, når alle er gamle nok
const hsNeverIkon=()=>(players.some(p=>p&&p.age>0&&p.age<18)?'🥤':'🍷');
const hsBarnMed=()=>players.some(p=>p&&p.age>0&&p.age<18);
const skalViseDisc=()=>{try{return localStorage.getItem('hs_disclaimer')!=='ja'}catch(e){return false}};
function hsDiscLuk(){try{localStorage.setItem('hs_disclaimer','ja')}catch(e){};const d=document.getElementById('discl');if(d)d.remove()}
function hsOm(){
 const da = (window.HSLANG||'da')==='da';
 const tekst = da
  ? '<h2 style="margin-top:0">🎲 Om Hygge Games</h2>'
   +'<p class="hint" style="text-align:left"><b>Hygge</b> er den danske tradition for at være sammen i et roligt tempo – uden præstationspres, med tid til hinanden, noget godt at spise og plads til at grine. Det handler ikke om at vinde, men om at være sammen.</p>'
   +'<p class="hint" style="text-align:left">Hygge Games er bygget op om netop det: én skærm, alle kan være med, og samværet er vigtigere end pointene. Spillene er korte nok til, at man kan tale sammen undervejs.</p>'
   +'<p class="hint" style="text-align:left">Alt indhold er skrevet til Hygge Games – inspireret af klassiske selskabsspil, gamle lege og traditioner, aldrig kopieret. Kan du lide et spil, så køb den fysiske udgave, hvis den findes.</p>'
  : '<h2 style="margin-top:0">🎲 About Hygge Games</h2>'
   +'<p class="hint" style="text-align:left"><b>Hygge</b> is the Danish tradition of being together at an easy pace – with no pressure to perform, time for each other, something good to eat and room to laugh. It is not about winning; it is about being together.</p>'
   +'<p class="hint" style="text-align:left">Hygge Games is built around exactly that: one screen, everyone can join in, and the time together matters more than the score.</p>'
   +'<p class="hint" style="text-align:left">All content is written for Hygge Games – inspired by classic party games, old playground games and traditions, never copied. If you like a game, please buy the physical original where one exists.</p>';
 const d=document.createElement('div');d.className='modal';d.style.zIndex='80';
 d.innerHTML='<div class="mbox" style="width:min(560px,100%)">'+tekst
  +'<div class="row" style="margin-top:14px"><button class="btn big green" id="om-luk">'+(da?'Forstået':'Got it')+'</button></div></div>';
 document.body.appendChild(d);
 d.querySelector('#om-luk').onclick=()=>d.remove();
 d.addEventListener('click',e=>{if(e.target===d)d.remove()});
}
const hsDareTitel=()=>(hsBarnMed()?'Saftevands udfordringer':'Vinudfordringer');
const hsDareIkon=()=>(hsBarnMed()?'🧃':'🍷');

/* Udvidelses-hooks: ext.js kan tilføje spil (GAMES.push), nye spiltyper (KINDS) og byggere til valgspil (CHOICE_BUILD) */
window.KINDS={};window.CHOICE_BUILD={};
/* oprydning af to ugyldige indgange */
DATA.tl=DATA.tl.filter(x=>!x.a[1].includes('2.500 år gammel'));
DATA.riddle=DATA.riddle.filter(x=>!x.q.startsWith('Hvad kan man have, uden'));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>LS.set('players',players);
const fmt=n=>Number(n).toLocaleString('da-DK',{maximumFractionDigits:2});
const parseNum=s=>{s=String(s).trim().replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');const v=parseFloat(s);return isNaN(v)?null:v};
const GAMES=[
{id:'ffm',grp:'Gæt & kvis',key:'num',kind:'ffm',t:'Fugl, fisk eller midtimellem',d:'To gætter et tal – resten vurderer: højere, lavere eller midt imellem? (2 spillere = klassisk Tættest på)',e:'🐦',g:'linear-gradient(135deg,#ff5d8f,#ff9e4a)',min:2},
{id:'est',grp:'Gæt & kvis',key:'num',kind:'est',t:'Tættest på',d:'Alle gætter et tal i hemmelighed – nærmest vinder',e:'🎯',g:'linear-gradient(135deg,#8f6bff,#4cc9f0)',min:2},
{id:'tf',grp:'Gæt & kvis',key:'tf',kind:'choice',t:'Sandt eller falsk',d:'Skøre påstande – træk navnet til dit svar',e:'🤔',g:'linear-gradient(135deg,#2ec4b6,#80ed99)',min:2},
{id:'odd',grp:'Gæt & kvis',key:'odd',kind:'choice',t:'Find løgnen',d:'Fire påstande – én er falsk',e:'🕵️',g:'linear-gradient(135deg,#f15bb5,#8f6bff)',min:2},
{id:'tl',grp:'Gæt & kvis',key:'tl',kind:'choice',t:'Hvad skete først?',d:'Tidslinjens skøreste rækkefølger',e:'⏳',g:'linear-gradient(135deg,#4361ee,#4cc9f0)',min:2},
{id:'mys',grp:'Mysterie & hjernevrid',key:'mys',kind:'choice',t:'Hvem gjorde det?',d:'Få spor ad gangen – stem på den skyldige',e:'🔍',g:'linear-gradient(135deg,#3a0ca3,#7209b7)',min:2},
{id:'riddle',grp:'Mysterie & hjernevrid',key:'riddle',kind:'qa',t:'Gåder',d:'Hjernevrid og kluntede tricks – først med svaret får point',e:'🧩',g:'linear-gradient(135deg,#0ead69,#2ec4b6)',min:2},
{id:'who',grp:'Mysterie & hjernevrid',key:'who',kind:'who',t:'Hvem/hvad er jeg?',d:'Spor ét ad gangen – jo færre spor, jo flere point',e:'🎭',g:'linear-gradient(135deg,#f72585,#7209b7)',min:2},
{id:'taboo',grp:'Party & leg',key:'taboo',kind:'secret',t:'Forbudte ord',d:'Forklar ordet uden de forbudte – 60 sekunder',e:'🚫',g:'linear-gradient(135deg,#d00000,#ff7b00)',min:2},
{id:'char',grp:'Party & leg',key:'char',kind:'secret',t:'Gæt og vis',d:'Spil det uden lyd – de andre gætter (let, mellem, svær)',e:'🎬',g:'linear-gradient(135deg,#ffb703,#fb8500)',min:2},
{id:'rat',grp:'Party & leg',key:'rather',kind:'choice',t:'Hellere end',d:'Skøre valg – hvor lander holdet?',e:'⚖️',g:'linear-gradient(135deg,#ffb703,#ff5d8f)',min:2},
{id:'lik',grp:'Party & leg',key:'likely',kind:'cards',t:'Mest sandsynlig til…',d:'Tæl til tre og peg!',e:'👆',g:'linear-gradient(135deg,#4cc9f0,#3a0ca3)',min:2},
{id:'nev',grp:'Party & leg',key:'never',kind:'cards',t:'Jeg har aldrig…',d:'Tag en tår, hvis det passer på dig',e:'🍷',g:'linear-gradient(135deg,#c9184a,#590d22)',min:1},
{id:'dare',grp:'Party & leg',key:'dare',kind:'award',t:'Vinudfordringer',d:'Små opgaver – udfør og tjen point',e:'🥂',g:'linear-gradient(135deg,#ff7b00,#d00000)',min:2},
{id:'deep',grp:'Hygge & dybde',key:'deep',kind:'cards',t:'Dybe samtaler',d:'Date night og familieaften – spørgsmål til lange snakke',e:'💬',g:'linear-gradient(135deg,#6a4c93,#1982c4)',min:1}
];
const gm=id=>GAMES.find(a=>a.id===id);
const pool=k=>{
  const sprog=(window.HSLANG||'da');
  if(sprog!=='da'){
    const e=DATA[k+'_'+sprog];
    if(Array.isArray(e))return e;
    return [];
  }
  return k==='num'?DATA.num.concat(own):(DATA[k]||[]);
};
/* Åbner spillets indre for udvidelser (spilvalg.js): spillere, visning og valgmuligheder */
window.hsSpil={get players(){return players},get view(){return view},get g(){return g},gm,pool};
const idOf=it=>typeof it==='string'?it:(it.q&&it.a!==undefined&&typeof it.a!=='object'?it.q:(it.q||it.s||it.t||it.w||(it.o&&it.o[0])||it.b||it.a||it.c||JSON.stringify(it)))+(it.a&&typeof it.a==='object'?'|'+it.a[0]:'');
function draw(gk,list){let seen=LS.get('seen2_'+gk,[]);let av=list.filter(x=>!seen.includes(idOf(x)));if(!av.length){seen=[];av=list}const it=av[Math.random()*av.length|0];seen.push(idOf(it));LS.set('seen2_'+gk,seen);return it}
function boom(){const em=['🎉','🃏','✨','🎲','🎊','⭐'];for(let i=0;i<34;i++){const s=document.createElement('div');s.className='conf';s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.6+'s';s.style.fontSize=(18+Math.random()*20)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
function add(i,n){players[i].s+=n;save();g.gp=g.gp||{};g.gp[i]=(g.gp[i]||0)+n;renderScore()}
function ask(text,yes){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="mbox"><h3 style="margin-top:0">${esc(text)}</h3><div class="row"><button class="btn red" id="cy">Ja</button><button class="btn ghost" id="cn">Annuller</button></div></div>`;document.body.appendChild(d);d.querySelector('#cn').onclick=()=>d.remove();d.querySelector('#cy').onclick=()=>{d.remove();yes()}}

function hsMenu(){
 const d=document.createElement('div');d.className='modal';d.style.zIndex='96';
 d.innerHTML='<div class="mbox" style="max-width:420px"><h2 style="margin-top:0">⋯ '+t('menu')+'</h2>'
  +'<div class="row" style="justify-content:flex-start;flex-wrap:wrap">'
  +'<button class="btn" data-m="pl">👥 '+t('players')+'</button>'
  +'<button class="btn" data-m="q">➕ '+t('suggest')+'</button>'
  +'<button class="btn" data-m="new">↺ '+t('newEvening')+'</button>'
  +(window.hsGrupper?'<button class="btn ghost" data-m="grp">👨‍👩‍👧 '+(window.hsGruppeNavn?hsGruppeNavn():t('groups'))+'</button>':'')
  +(window.hsVoksenSynlig&&hsVoksenSynlig()?'<button class="btn ghost" data-m="voksen">🔞 18+</button>':'')
  +(window.hsRumKan&&hsRumKan()?'<button class="btn ghost" data-m="rum">📱 '+(window.HSLANG==='en'?'Play together':'Spil sammen')+'</button>':'')
  +'<button class="btn ghost" data-m="sprog">🌐 '+t('language')+'</button>'
  +'<button class="btn ghost" data-m="about">ℹ️ '+t('about')+'</button>'
  +'<button class="btn ghost" data-m="support">☕ '+t('support')+'</button>'

 if(cb){const r=cb(it);q=r.q;zones=r.zones;cor=r.cor}
 else if(view==='tf'){q=it.s;zones=[{id:'t',l:'Sandt',e:'✅',c:'#2ec4b6'},{id:'f',l:'Falsk',e:'❌',c:'#ff5d8f'}];cor=it.t?'t':'f'}
 else if(view==='odd'){q='Hvilken påstand er LØGN?';const cs=['#ff5d8f','#ffb703','#2ec4b6','#8f6bff'];zones=it.o.map((t,i)=>({id:'o'+i,l:esc(t),e:'ABCD'[i],c:cs[i]}));cor='o'+it.a}
 else if(view==='tl'){q=it.q;zones=[{id:'a',l:esc(it.a[0]),e:'🅰️',c:'#4cc9f0'},{id:'b',l:esc(it.a[1]),e:'🅱️',c:'#ff5d8f'}];cor=it.c===0?'a':'b'}
 else if(view==='mys'){const cs=['#ff5d8f','#ffb703','#2ec4b6','#8f6bff','#4cc9f0'];q=null;zones=it.p.map((t,i)=>({id:'o'+i,l:esc(t),e:'👤',c:cs[i%5]}));cor='o'+it.a;pre=mysHead(it);
  if(g.ph===0)return `<div class="card glass">${pre}<div class="row">${g.cl<it.c.length?'<button class="btn" id="clue">🔎 Næste spor</button>':''}<button class="btn green" id="vote">Stem på den skyldige →</button></div><p class="hint">Diskutér sporene, før I stemmer. Rigtigt svar giver 1 point.</p></div>`}
 else{q='Hvad ville du helst?';zones=[{id:'a',l:esc(it.a),e:'🅰️',c:'#ff5d8f'},{id:'b',l:esc(it.b),e:'🅱️',c:'#4cc9f0'}]}
 g.b={judges:players.map((_,i)=>i),zones,reveal:g.reveal,correct:g.reveal?cor:null,correct0:cor};
 let o=`<div class="card glass">${pre}${q?`<div class="q">${esc(q)}</div>`:''}<div id="board">${boardHTML(g.b)}</div>`;
 if(!g.reveal)o+=`<div class="row"><button class="btn big" id="go">${cor?'Afslør!':'Vis fordeling'}</button></div>`;
 else{if(cor)o+=`<div class="res"><span>${g.sol.length?'✅ Point til: '+g.sol.map(i=>esc(players[i].n)).join(', '):'😅 Ingen havde ret'}</span></div>${it.e?`<p class="hint">${esc(it.e)}</p>`:''}`;
  else{const c={};players.forEach((p,i)=>{const z=g.assign[i];if(z)c[z]=(c[z]||0)+1});o+=`<div class="res">${zones.map(z=>`<span>${z.e} ${c[z.id]||0} stemmer</span>`).join('')}</div>`}
  o+=`<div class="row"><button class="btn big green" id="nx">Næste →</button></div>`}
 return o+'</div>';
}
function qa(){
 const it=g.item;
 return `<div class="card glass"><div class="q">${esc(it.q)}</div>`+(g.ans?`<div class="ans" style="font-size:clamp(24px,4vw,40px)">${esc(it.a)}</div><p class="hint">Hvem gættede rigtigt?</p>${awardChips(1,-1)}<div class="row" style="margin-top:12px"><button class="btn ghost" id="skip">Ingen – næste gåde →</button></div>`:`<div class="row"><button class="btn big" id="shans">Vis svaret</button><button class="btn ghost" id="skip">Spring over</button></div>`)+'</div>';
}
function who(){
 const it=g.item,pts=Math.max(1,6-g.cl);
 const gx=GAMES.find(x=>x.id===view)||{e:'🎭',t:'Hvem/hvad er jeg?'};
 let o=`<div class="card glass"><div class="tag">${gx.e||'🎭'} ${esc(gx.t||'Hvem/hvad er jeg?')} – ${g.cl} af ${it.c.length} spor</div><div class="mid">${it.c.slice(0,g.cl).map((c,i)=>`<div class="opt glass">${i+1}. ${esc(c)}</div>`).join('')}</div>`;
 if(g.ans)return o+`<div class="ans" style="font-size:clamp(26px,4.5vw,44px)">${esc(it.a)}</div><p class="hint">Hvem gættede det? (${pts} point – ${g.cl} spor brugt)</p>${awardChips(pts,-1)}<div class="row" style="margin-top:12px"><button class="btn ghost" id="skip">Ingen – næste →</button></div></div>`;
 return o+`<p class="hint">Jo færre spor, jo flere point (5 spor = 1 point, 1 spor = 5 point). Sig gættet højt!</p><div class="row">${g.cl<it.c.length?'<button class="btn" id="clue">Næste spor</button>':''}<button class="btn green" id="shans">Vis svaret</button></div></div>`;
}
function secret(){
 const it=g.item,p=players[g.turn],isT=view==='taboo';
 let o=`<div class="card glass"><div class="row"><span class="tag" style="background:${p.c};color:#111">${isT?'Forklarer':'Skuespiller'}: ${esc(p.n)}</span></div>`;
 if(!g.shown)return o+`<div class="q">Kun ${esc(p.n)} må se skærmen!</div><div class="row"><button class="btn big" id="show">Vis kort</button><button class="btn ghost" id="skip">Nyt kort</button></div></div>`;
 o+=isT?`<div class="ans" style="font-size:clamp(34px,6vw,60px)">${esc(it.w)}</div><div class="hint">Forbudte ord:</div><div class="forb">${it.f.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:`<div class="q" style="font-size:clamp(26px,4vw,42px)">${esc(it)}</div><p class="hint">Ingen lyde eller ord – kun krop og ansigt!</p>`;
 o+=`<div class="tm" id="tm">${g.tend?'':'60 sek'}</div><div class="row"><button class="btn" id="tmb">⏱ Start 60 sek</button></div><p class="hint" style="margin-top:14px">Hvem gættede det? (gæt og forklarer/skuespiller får hver +1)</p>${awardChips(1,g.turn,g.turn)}<div class="row" style="margin-top:12px"><button class="btn ghost" id="skip">Ingen gættede – næste →</button></div></div>`;
 return o;
}
function cards(aw){
 const p=players[g.turn];
 let o=`<div class="card glass big-card"><div><div class="row"><span class="tag" style="background:${p.c};color:#111">Tur: ${esc(p.n)}</span></div><div class="q" style="font-size:clamp(24px,4vw,40px)">${esc(g.item)}</div>`;
 if(aw)o+=`<p class="hint">Hvem klarede udfordringen? Giv et point:</p>${awardChips(1,-1)}<div class="row" style="margin-top:14px"><button class="btn ghost" id="skip">Næste uden point →</button></div>`;
 else o+=`<div class="row"><button class="btn big green" id="nx">Næste →</button></div>`;
 return o+'</div></div>';
}
</script>
